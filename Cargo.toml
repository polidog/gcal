[package]
name = "gcal"
version = "0.2.1"
edition = "2024"
description = "Lightweight Google Calendar CLI/TUI with multi-account support"
repository = "https://github.com/polidog/gcal"
license = "MIT"
keywords = ["google-calendar", "cli", "tui", "calendar"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = "z"
